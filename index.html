<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AID - Medical Skin Classifier</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- TensorFlow.js & Teachable Machine Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.7.4/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8.3/dist/teachablemachine-image.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur py-4 px-6 flex justify-between items-center">
    <div class="flex items-center space-x-2">
      <span class="bg-indigo-600 text-xs font-bold px-2.5 py-1 rounded-md text-white tracking-wide">AID</span>
      <h1 class="text-xl font-semibold">Skin Diagnostics AI</h1>
    </div>
    <span class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">MobileNetV2 Engine</span>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-6 flex flex-col gap-6">

    <!-- Model Source Config Tab -->
    <section class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">1. Model Configuration</h2>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        
        <!-- Hosted Model Option -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-slate-300">Option A: Model Folder Path / Public URL</label>
          <div class="flex gap-2">
            <input type="text" id="modelUrlInput" value="./model/" placeholder="./model/" class="bg-slate-900 text-slate-200 border border-slate-700 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:border-indigo-500" />
            <button onclick="loadFromUrl()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm px-4 py-2 rounded-lg transition">Load</button>
          </div>
        </div>

        <!-- Local Upload Option -->
        <div class="flex flex-col gap-2">
          <label class="text-xs font-medium text-slate-300">Option B: Upload (.json, .bin, metadata.json)</label>
          <input type="file" id="localFilesInput" multiple accept=".json,.bin" class="block w-full text-xs text-slate-400 file:mr-3 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-slate-700 file:text-slate-200 hover:file:bg-slate-600 cursor-pointer" />
        </div>
      </div>
      <div id="modelStatus" class="mt-3 text-xs text-amber-400 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-amber-400"></span> Model state: Not initialized
      </div>
    </section>

    <!-- Diagnostics Console -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-6 flex-1">
      
      <!-- Input Panel -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 flex flex-col items-center justify-center border-dashed border-2 relative min-h-[300px]">
        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
        
        <div id="uploadPlaceholder" onclick="document.getElementById('imageInput').click()" class="cursor-pointer text-center p-6 hover:opacity-80 transition">
          <svg class="mx-auto h-12 w-12 text-slate-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
          <p class="text-sm text-slate-300 font-medium">Click to upload skin image</p>
          <p class="text-xs text-slate-500 mt-1">PNG, JPG, or WEBP</p>
        </div>

        <img id="imagePreview" class="hidden max-h-72 w-auto rounded-lg object-contain border border-slate-700" alt="Preview" />
      </div>

      <!-- Results Panel -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-5 flex flex-col">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Diagnostic Outputs</h2>
        
        <div id="resultsContainer" class="flex-1 flex flex-col gap-3 justify-center">
          <p class="text-xs text-slate-500 text-center">Load a model and submit an image to calculate predictions.</p>
        </div>
      </div>
    </section>
  </main>

  <script>
    let model;

    function setStatus(msg, state = 'warn') {
      const el = document.getElementById('modelStatus');
      const color = state === 'success' ? 'bg-emerald-400' : state === 'error' ? 'bg-rose-500' : 'bg-amber-400';
      const textColor = state === 'success' ? 'text-emerald-400' : state === 'error' ? 'text-rose-400' : 'text-amber-400';
      el.className = `mt-3 text-xs ${textColor} flex items-center gap-2`;
      el.innerHTML = `<span class="w-2 h-2 rounded-full ${color}"></span> ${msg}`;
    }

    // Load hosted model URL
    async function loadFromUrl() {
      const url = document.getElementById('modelUrlInput').value.replace(/\/$/, "") + "/";
      try {
        setStatus("Loading model...", "warn");
        model = await tmImage.load(url + "model.json", url + "metadata.json");
        setStatus("Model successfully loaded from path", "success");
      } catch (err) {
        setStatus("Failed to load model from path. Verify directory/files exist.", "error");
      }
    }

    // Load via File Input
    document.getElementById('localFilesInput').addEventListener('change', async (e) => {
      const files = e.target.files;
      let modelFile, weightsFile, metadataFile;

      for (let f of files) {
        if (f.name === "model.json") modelFile = f;
        else if (f.name.endsWith(".bin")) weightsFile = f;
        else if (f.name === "metadata.json") metadataFile = f;
      }

      if (modelFile && weightsFile && metadataFile) {
        try {
          setStatus("Loading uploaded files...", "warn");
          model = await tmImage.loadFromFiles(modelFile, weightsFile, metadataFile);
          setStatus("Uploaded model initialized successfully", "success");
        } catch (err) {
          setStatus("Invalid or corrupted Teachable Machine files.", "error");
        }
      } else {
        setStatus("Upload all 3 required files: model.json, weights.bin, metadata.json", "error");
      }
    });

    // Handle Image Upload & Classification
    async function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const imgEl = document.getElementById('imagePreview');
      imgEl.src = URL.createObjectURL(file);
      imgEl.classList.remove('hidden');
      document.getElementById('uploadPlaceholder').classList.add('hidden');

      if (!model) {
        alert("Please load or upload a model first!");
        return;
      }

      imgEl.onload = async () => {
        const predictions = await model.predict(imgEl);
        displayPredictions(predictions);
      };
    }

    // Render Probabilities
    function displayPredictions(predictions) {
      const container = document.getElementById('resultsContainer');
      container.innerHTML = "";

      // Sort by probability highest -> lowest
      predictions.sort((a, b) => b.probability - a.probability);

      predictions.forEach((item, idx) => {
        const percent = (item.probability * 100).toFixed(1);
        const isTop = idx === 0;

        const row = document.createElement('div');
        row.className = "flex flex-col gap-1";
        row.innerHTML = `
          <div class="flex justify-between text-xs font-medium">
            <span class="${isTop ? 'text-indigo-400 font-bold' : 'text-slate-300'}">${item.className}</span>
            <span class="${isTop ? 'text-indigo-400 font-bold' : 'text-slate-400'}">${percent}%</span>
          </div>
          <div class="w-full bg-slate-900 rounded-full h-2">
            <div class="${isTop ? 'bg-indigo-500' : 'bg-slate-600'} h-2 rounded-full transition-all duration-300" style="width: ${percent}%"></div>
          </div>
        `;
        container.appendChild(row);
      });
    }
  </script>
</body>
</html>
